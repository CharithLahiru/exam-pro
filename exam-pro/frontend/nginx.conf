server {
    listen 80;
    server_name localhost;

    # Handle /exam-pro/ base path configured in Vite
    location /exam-pro/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /exam-pro/index.html;
    }

    # Redirect root to /exam-pro/
    location = / {
        return 301 /exam-pro/;
    }

    # Fallback for direct root assets
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
